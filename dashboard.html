<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - PAWGRAMMED</title>
        <style>
            @font-face {
                font-family: "Paw";
                src: url("Paw.otf") format("opentype");
            }

            @font-face {
                font-family: "main";
                src: url("main.ttf") format("truetype");
            }

            @font-face {
                font-family: "Fredoka";
                font-weight: 400;
                src: url("fredoka-regular.ttf") format("truetype");
            }

            @font-face {
                font-family: "Fredoka";
                font-weight: 600;
                src: url("fredoka-semibold.ttf") format("truetype");
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                background-color: #E3E0D7;
                background-image: url("bg.jpg");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                overflow: hidden;
            }

            body {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                color: #211d1b;
                font-family: "Fredoka", sans-serif;
            }

            .dashboard-stage {
                position: relative;
                width: min(100vw, calc(100vh * (2560 / 1440)));
                aspect-ratio: 2560 / 1440;
                max-height: 100vh;
                max-height: 100dvh;
                container-type: inline-size;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .dashboard-frame {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                pointer-events: none;
                user-select: none;
                z-index: 1;
            }

            .dashboard-card {
                position: absolute;
                left: 9.85%;
                top: 10%;
                width: 80.3%;
                height: 80%;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 3% 4%;
                gap: clamp(8px, 1.4cqw, 24px);
            }

            h1 {
                font-family: "main", cursive, sans-serif;
                font-size: clamp(22px, 3.2cqw, 52px);
                font-weight: normal;
                letter-spacing: 0.5px;
                color: #211d1b;
                line-height: 1.15;
            }

            .dashboard-subtitle {
                font-size: clamp(13px, 1.3cqw, 22px);
                color: #554d48;
                max-width: 85%;
                line-height: 1.35;
            }

            .user-profile-badge {
                width: 100%;
                max-width: 46cqw;
                padding: clamp(8px, 1.1cqw, 18px) clamp(14px, 1.5cqw, 26px);
                background-color: #fae3cb;
                border: 2px solid #211d1b;
                border-radius: clamp(12px, 1.3cqw, 22px);
                display: flex;
                align-items: center;
                gap: clamp(8px, 1.2cqw, 18px);
                text-align: left;
                box-shadow: 0 4px 0 rgba(33, 29, 27, 0.1);
            }

            .user-avatar {
                width: clamp(38px, 3.8cqw, 58px);
                height: clamp(38px, 3.8cqw, 58px);
                border-radius: 50%;
                border: 2px solid #211d1b;
                background-color: #fff8f0;
                object-fit: contain;
                padding: 4px;
                flex-shrink: 0;
            }

            .user-details {
                flex: 1;
                min-width: 0;
            }

            .user-name {
                font-size: clamp(14px, 1.4cqw, 20px);
                font-weight: 700;
                color: #211d1b;
                margin-bottom: 2px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .user-meta {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                font-size: clamp(11px, 1.05cqw, 15px);
                color: #554d48;
            }

            .user-status-pill {
                display: inline-flex;
                align-items: center;
                padding: 2px 10px;
                border-radius: 999px;
                border: 1.5px solid #211d1b;
                background-color: #d7f5db;
                color: #145a27;
                font-size: clamp(10px, 0.9cqw, 13px);
                font-weight: 600;
                text-transform: capitalize;
            }

            .user-status-pill.unverified {
                background-color: #fce8cc;
                color: #8a4b08;
            }

            .dashboard-actions {
                display: flex;
                gap: clamp(8px, 1.2cqw, 18px);
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 4px;
            }

            .btn {
                padding: clamp(7px, 0.85cqw, 13px) clamp(16px, 1.6cqw, 26px);
                border-radius: clamp(10px, 1.1cqw, 16px);
                border: 2px solid #211d1b;
                font-family: "Fredoka", sans-serif;
                font-size: clamp(12px, 1.1cqw, 17px);
                font-weight: 600;
                text-decoration: none;
                cursor: pointer;
                transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
                display: inline-block;
                box-shadow: 0 4px 0 rgba(33, 29, 27, 0.12);
            }

            .btn-primary {
                background-color: #211d1b;
                color: #fff8f0;
            }

            .btn-primary:hover {
                background-color: #fff8f0;
                color: #211d1b;
                transform: translateY(-2px);
                box-shadow: 0 6px 0 rgba(33, 29, 27, 0.18);
            }

            .btn-secondary {
                background-color: #fff8f0;
                color: #211d1b;
            }

            .btn-secondary:hover {
                background-color: #211d1b;
                color: #fff8f0;
                transform: translateY(-2px);
                box-shadow: 0 6px 0 rgba(33, 29, 27, 0.18);
            }

            @media (max-width: 680px) {
                html, body {
                    overflow-y: auto;
                }

                body {
                    align-items: center;
                    padding: 24px 16px;
                }

                .dashboard-stage {
                    width: 100%;
                    max-width: 500px;
                    height: auto;
                    max-height: none;
                    aspect-ratio: auto;
                    position: relative;
                }

                .dashboard-frame {
                    display: none;
                }

                .dashboard-card {
                    position: relative;
                    left: auto;
                    top: auto;
                    width: 100%;
                    height: auto;
                    min-height: 400px;
                    background-color: #FFF8EE;
                    border: 2.5px solid #211d1b;
                    border-radius: 22px;
                    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18), 0 4px 0 rgba(33, 29, 27, 0.12);
                    padding: 36px 20px 28px;
                    gap: 16px;
                }

                .user-profile-badge {
                    max-width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="dashboard-stage">
            <img src="images/final-final-dash.png" class="dashboard-frame" alt="" aria-hidden="true" onerror="this.src='images/finai-final-dash.png'">

            <main class="dashboard-card">
                <h1>This works yayayayay</h1>
                <p class="dashboard-subtitle">Welcome to your Pawgrammed lair! You are successfully logged in.</p>
                <div class="user-profile-badge" id="userBox">
                    <img src="images/rex_main_front.png" class="user-avatar" alt="Rex mascot">
                    <div class="user-details">
                        <div class="user-name">Loading your profile...</div>
                        <div class="user-meta">Connecting to Hack Club Auth</div>
                    </div>
                </div>
                <div class="dashboard-actions">
                    <a href="/" class="btn btn-secondary">&larr; Back to Home</a>
                    <a href="/logout" class="btn btn-primary">Log out</a>
                </div>
            </main>
        </div>
        <script>
            function renderUser(u) {
                const name = u.name || [u.first_name, u.last_name].filter(Boolean).join(' ') || u.nickname || 'Hacker';
                const email = u.email || u.primary_email || 'No email provided';
                const rawStatus = (u.verification_status || (u.email_verified ? 'verified' : 'unverified')).toString();
                const isVerified = rawStatus.toLowerCase().includes('verified') || rawStatus.toLowerCase().includes('eligible');
                const statusClass = isVerified ? '' : 'unverified';
                const avatar = u.profile_picture || u.avatar_url || 'images/rex_main_front.png';

                document.getElementById('userBox').innerHTML = `
                    <img src="${avatar}" class="user-avatar" alt="User avatar" onerror="this.src='images/rex_main_front.png'">
                    <div class="user-details">
                        <div class="user-name">${name}</div>
                        <div class="user-meta">
                            <span>${email}</span>
                            <span class="user-status-pill ${statusClass}">${rawStatus}</span>
                        </div>
                    </div>
                `;
            }

            if (window.location.protocol !== 'file:') {
                fetch('/api/me')
                    .then(res => {
                        if (!res.ok) throw new Error('Not logged in');
                        return res.json();
                    })
                    .then(data => {
                        renderUser(data.user || {});
                    })
                    .catch(() => {
                        window.location.href = '/login';
                    });
            } else {
                renderUser({
                    name: 'Orpheus Hackworth',
                    email: 'orpheus@hackclub.com',
                    verification_status: 'YSWS Eligible'
                });
            }
        </script>
    </body>
</html>
